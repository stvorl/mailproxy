# Example accounts file for mailproxy.
# Copy this file to accounts.yml and fill in real credentials.

global:
  # How often to poll all accounts, in minutes. Per-account override: fetch_interval below.
  default_fetch_interval: 15

accounts:
  # -------------------------------------------------------------------------
  # Account 1: implicit SSL (POP3S on port 995), outbound with required TLS
  # -------------------------------------------------------------------------
  - address: alice@example.com

    # Inbound: how to fetch mail from the remote provider via POP3.
    #
    # port + tls combinations:
    #   port: 995, tls: true   — POP3S, implicit SSL (connection is encrypted from the start)
    #   port: 110, tls: true   — POP3 + STARTTLS (plain connection upgraded to TLS)
    #   port: 110, tls: false  — plain, unencrypted (avoid unless no other option)
    #
    # keep_remote: false — delete from remote immediately after fetching (default)
    # keep_remote: true  — keep on remote indefinitely, never delete
    # keep_remote: 10m   — keep for 10 minutes  (m = minutes; useful for testing)
    # keep_remote: 12h   — keep for 12 hours
    # keep_remote: 7d    — keep for 7 days  (d or D)
    # keep_remote: 3M    — keep for 3 months (~30 days each, uppercase M)
    # keep_remote: 30s   — keep for 30 seconds
    # Messages are fetched only once regardless of keep_remote value;
    # a local state file (.fetch_state_*.json in the mailbox directory) tracks
    # what has already been downloaded.
    inbound:
      host: pop.example.com
      port: 995
      proto: pop3
      tls: true
      user: alice@example.com
      pass: remote_password_here
      keep_remote: false
      # fetch_interval: 10  # optional: poll this account every 10 min (overrides default_fetch_interval)

    # Outbound: SMTP relay used by Postfix to send mail from this account.
    #
    # port + tls combinations:
    #   port: 587, tls: true   — submission with STARTTLS (most common)
    #   port: 465, tls: true   — SMTPS, implicit SSL
    #   port: 25,  tls: false  — plain MTA port, no auth (rare; use only if required)
    #
    # tls: true  — Postfix will require TLS for this relay (smtp_tls_policy: encrypt)
    # tls: false — Postfix will try TLS opportunistically (smtp_tls_policy: may)
    outbound:
      host: smtp.example.com
      port: 587
      tls: true
      user: alice@example.com
      pass: smtp_password_here

    # Local: IMAP credentials used by Dovecot for this mailbox.
    #
    # Simple form (backwards-compatible): single login, username = mailbox name.
    local:
      user: alice@example.com
      password: local_imap_password

  # -------------------------------------------------------------------------
  # Account 2: STARTTLS inbound (port 110), outbound with required TLS
  # -------------------------------------------------------------------------
  - address: bob@example.org

    inbound:
      host: pop.other.net
      port: 110            # plain port; tls: true triggers STARTTLS after connect
      proto: pop3
      tls: true
      user: bob@example.org
      pass: remote_password_here
      keep_remote: false      # fetch_interval: 30  # optional per-account override in minutes
    outbound:
      host: smtp.other.net
      port: 587
      tls: true
      user: bob@example.org
      pass: smtp_password_here

    # Local: multiple logins sharing one mailbox.
    # 'mailbox' sets the storage path; 'logins' lists all allowed IMAP users.
    # If 'password' is omitted and 'logins' is absent, the mailbox still
    # receives mail via fetcher but has no IMAP access.
    local:
      mailbox: bob@example.org
      password: bobs_default_password  # This password is mandatory, if even no user is logging under "base" login
      logins: # We can add multiple logins for the same mailbox, e.g. to have separate credentials.  
        - user: bob
          password: bobs_password
        - user: carol
          password: carols_password

# Security notes:
# - This file contains plaintext credentials. Never commit accounts.yml to
#   version control (it is listed in .gitignore).
# - Restrict file permissions: chmod 600 accounts.yml
# - The fetcher re-reads this file every fetch cycle. Changes take effect
#   on the next cycle without restarting containers.

  # -------------------------------------------------------------------------
  # Account 3: fetch via IMAP instead of POP3
  # -------------------------------------------------------------------------
  # Use proto: imap when the remote server does not support POP3, or when you
  # need to fetch from a specific folder other than INBOX.
  #
  # folder: comma-separated list of IMAP folders to fetch from (default: INBOX)
  # keep_remote: false — delete messages after fetching (default)
  # keep_remote: true  — leave messages on the server
  # (all duration formats also apply, same as for POP3 above)
  #
  # port + tls combinations:
  #   port: 993, tls: true  — IMAPS, implicit SSL
  #   port: 143, tls: true  — IMAP + STARTTLS
  #   port: 143, tls: false — plain IMAP (avoid unless no other option)
  - address: charlie@example.com

    inbound:
      host: imap.example.com
      port: 993
      proto: imap
      tls: true
      folder: INBOX               # optional; comma-separated, e.g. "INBOX, SPAM"
      user: charlie@example.com
      pass: remote_password_here
      keep_remote: false

    outbound:
      host: smtp.example.com
      port: 587
      tls: true
      user: charlie@example.com
      pass: smtp_password_here

    local:
      user: charlie@example.com
      password: local_charlie_password

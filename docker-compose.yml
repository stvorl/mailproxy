version: '3.8'
services:
  dovecot:
    build: ./docker/dovecot
    environment:
      - IMAP_TLS=${IMAP_TLS:-1}
    volumes:
      - ./maildata:/var/mail
      - creds:/var/credentials:ro
      - ./logs/dovecot:/var/log/dovecot
      - ./certs:/certs
    ports:
      - "${IMAP_LISTEN:-127.0.0.1}:${IMAP_PORT:-143}:143"
      - "${IMAPS_LISTEN:-127.0.0.1}:${IMAPS_PORT:-993}:993"
    restart: unless-stopped
    networks:
      - mail

  postfix:
    build: ./docker/postfix
    environment:
      - SMTP_TLS=${SMTP_TLS:-1}
    volumes:
      - creds:/var/credentials:ro
      - ./logs/postfix:/var/log/postfix
      - ./certs:/certs
    ports:
      - "${SMTP_LISTEN:-127.0.0.1}:${SMTP_PORT:-587}:25"
    restart: unless-stopped
    networks:
      - mail

  fetcher:
    build: ./docker/fetcher
    volumes:
      - ./maildata:/var/mail
      - creds:/var/credentials
      - ./accounts.yml:/app/accounts.yml:ro
      - ./logs/fetcher:/var/log/fetcher
    depends_on:
      - dovecot
      - postfix
    restart: unless-stopped
    networks:
      - mail

  # Roundcube is optional. Start with: make up-roundcube
  roundcube:
    build: ./docker/roundcube
    environment:
      - IMAP_TLS=${IMAP_TLS:-1}
      - ROUNDCUBEMAIL_SMTP_SERVER=postfix
      - ROUNDCUBEMAIL_SMTP_PORT=25
      - ROUNDCUBEMAIL_PLUGINS=archive,zipdownload,fix_identity
    volumes:
      - ./logs/roundcube:/var/www/html/logs
      - ./docker/roundcube/plugins/fix_identity:/var/www/html/plugins/fix_identity:ro
      - creds:/var/credentials:ro
      - ./rcdata:/var/roundcube/db
    ports:
      - "${ROUNDCUBE_LISTEN:-127.0.0.1}:${ROUNDCUBE_PORT:-8080}:80"
    depends_on:
      - dovecot
      - postfix
    profiles:
      - roundcube
    restart: unless-stopped
    networks:
      - mail

networks:
  mail:
    driver: bridge

volumes:
  creds:

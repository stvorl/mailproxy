dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap

# Plain-text auth is acceptable inside the Docker network only.
# If you expose IMAP directly to the Internet, enable TLS below.
auth_allow_cleartext = yes

mail_driver = maildir
mail_path = %{home}/Maildir

passdb passwd-file {
  passwd_file_path = /var/credentials/passwd
}

# userdb reads home from passwd-file (field 6), supports multiple logins per mailbox.
userdb passwd-file {
  passwd_file_path = /var/credentials/passwd
}

# TLS disabled: Dovecot runs inside the Docker network.
# To enable: set ssl = yes and provide ssl_cert / ssl_key.
ssl = no

log_path = /var/log/dovecot/dovecot.log
info_log_path = /var/log/dovecot/dovecot.log

# Expose SASL service for Postfix over TCP (containers can't share Unix sockets).
service auth {
  inet_listener sasl {
    port = 12345
  }
}
